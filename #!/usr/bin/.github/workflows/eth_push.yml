name: ETH AI 分析推送

on:
  schedule:
    - cron: '*/5 * * * *'   # 每5分钟执行一次
  workflow_dispatch:        # 允许手动触发

jobs:
  run-eth-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: 安装依赖
        run: pip install requests
      
      - name: 运行ETH分析脚本
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python eth_analyzer.py